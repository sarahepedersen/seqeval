# seqeval config for Delphi fertility-model artifacts produced by
# `ferteval export-seqeval` (observed/generated/persons parquet, ages in DAYS).
#
# Place this file NEXT TO the parquet files (data paths resolve relative to the YAML's
# directory), or point the driver at it. Then run:
#
#   python examples/run_delphi_eval.py --config /path/to/<out>/seqeval/delphi_config.yaml --out results/

model:
  name: delphi

data:
  observed: observed.parquet
  generated: generated.parquet
  persons: persons.parquet
  event_definitions: event_definitions.csv
  age_unit: days                 # ferteval emits integer days

# Alias -> raw token as it appears in the `event` column. The Delphi birth token is CHILD
# (use CHILD_SON / CHILD_DAUGHTER or an id here if your export used representation: id).
events:
  birth: CHILD

persons:
  covariates: []                 # the sidecar has only person_id + birth_year

replicates:
  estimator: jeffreys
  interval: jeffreys
  level: 0.95
  min_replicates: 3              # >= your export n_seeds is ideal; lower for a smoke test
  bootstrap: {n: 200, seed: 7}
  convergence_curve: true

outcomes:
  first_birth:  {event: birth, n: 1}
  second_birth: {event: birth, n: 2, origin: first_birth}

arms:
  # past / observed
  descriptives:
    kaplan_meier: [first_birth, second_birth]
    fertility:
      ccf: true
      asfr: [period, cohort]
      ppr: {max_parity: 6}
    stratify_by: [cohort]

  # past / generated — backtesting at each jump-off window
  backtesting:
    windows: all                 # every (age_start, age_stop) present in generated.parquet
    conditions:
      - {name: p0, event: birth, max_count: 0}
      - {name: p1, event: birth, min_count: 1, max_count: 1}
    probability_outcomes:
      - {outcome: first_birth, by_age: 35, given: p0}
      - {outcome: second_birth, within_origin: 5, given: p1}
      - {event: birth, min_events: 1, within: 5}
      - {event: birth, min_events: 1, within: 5, given: p1}
    aggregate_targets: [ccf, asfr_cohort, ppr, km:first_birth, km:second_birth]
    min_seeds: 3                 # match/lower than your export n_seeds

  # future / generated — Lexis forecast, illegal-move checks, seed stability
  forecasting:
    windows: all
    lexis:
      outcome: first_birth
      ages: [15, 45]
      years: [1950, 2035]
      subgroup_by: []
    illegal_moves:
      - {event: birth, max_age: 45}
      - {event: birth, min_age: 15, severity: warn}
    seed_stability:
      individual: true
      aggregate: [ccf]

output:
  dir: results/
  figure_format: png
